monitor = ,preferred,auto,1
debug {
    disable_logs = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
general {
    layout = master
    gaps_out = 14
    gaps_in = 6
}
decoration {
    rounding = 14
    blur {
        enabled = true
    }
    shadow {
        enabled = true
    }
}
animations {
    bezier = emphasized, 0.05, 0.7, 0.1, 1.0
    animation = windowsMove, 1, 4, emphasized
    animation = workspaces, 1, 4, emphasized, slide
}
plugin = @JEXPO_SO@
bind = SUPER, Tab, exec, hyprctl dispatch jexpo:expo toggle
windowrule = float on, match:class ^(test.floaty)$
windowrule = size 500 300, match:class ^(test.floaty)$
windowrule = float on, match:class ^(test.pinny)$
windowrule = pin on, match:class ^(test.pinny)$
windowrule = size 300 160, match:class ^(test.pinny)$
windowrule = move 960 540, match:class ^(test.pinny)$
windowrule = workspace special:dropdown silent, match:class ^(test.droppy)$
windowrule = fullscreen on, match:class ^(test.fully)$
exec-once = hyprpaper
exec-once = waybar
exec-once = [workspace 1 silent] ghostty --gtk-single-instance=false --background=1d3557 -e sh -c 'echo ONE-A; exec sleep 9999'
exec-once = [workspace 1 silent] ghostty --gtk-single-instance=false --background=1d3557 -e sh -c 'echo ONE-B; exec sleep 9999'
exec-once = [workspace 2 silent] ghostty --gtk-single-instance=false --background=6a040f -e sh -c 'echo TWO; exec sleep 9999'
exec-once = [workspace 2 silent] ghostty --gtk-single-instance=false --class=test.floaty --background=444444 -e sh -c 'echo FLOAT; exec sleep 9999'
exec-once = [workspace 4 silent] ghostty --gtk-single-instance=false --background=2d6a4f -e sh -c 'echo FOUR; exec sleep 9999'
exec-once = [workspace 5 silent] ghostty --gtk-single-instance=false --background=7b2cbf -e sh -c 'while true; do date +%T.%N; sleep 0.1; done'
exec-once = [workspace 6 silent] ghostty --gtk-single-instance=false --class=test.fully --background=9a6324 -e sh -c 'echo FULL; exec sleep 9999'
exec-once = ghostty --gtk-single-instance=false --class=test.pinny --background=000075 -e sh -c 'echo PIN; exec sleep 9999'
exec-once = ghostty --gtk-single-instance=false --class=test.droppy --background=808000 -e sh -c 'echo DROP; exec sleep 9999'
